<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador Comparativo Rayner vs. Competencia</title>
  <style>
    :root {
      --rayner-blue: #005eb8;
      --rayner-light: #38bdf8;
      --dark: #090d16;
      --panel: #131b2e;
      --text: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    header h1 { font-size: 1.15rem; font-weight: 600; }
    header span { color: var(--rayner-light); font-weight: 700; }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      gap: 1.15rem;
    }

    /* Visor Comparativo */
    .simulator-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 540px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      user-select: none;
      touch-action: none;
      background: #0b1120;
      border: 1px solid #1e293b;
    }

    .sim-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .scene-content {
      width: 100%;
      height: 100%;
      transition: filter 0.35s ease;
    }

    .scene-content svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #layer-rayner {
      clip-path: inset(0 50% 0 0);
      z-index: 2;
    }

    /* Capa de Halos Nocturnos independiente para cada lente */
    .halo-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      mix-blend-mode: screen;
      background:
        /* Faro izquierdo (X: 34%, Y: 62%) */
        radial-gradient(circle at 34% 62%,
          rgba(255,255,255,0.95) 0%,
          rgba(255,245,210,0.5) 2.5%,
          rgba(255,210,130,0.12) 5%,
          rgba(255,235,190,0.42) 6.5%,
          rgba(255,200,100,0.08) 8.5%,
          rgba(255,220,160,0.32) 10%,
          rgba(255,180,80,0.05) 12.5%,
          rgba(255,210,140,0.2) 14%,
          transparent 19%),
        /* Faro derecho (X: 44%, Y: 62%) */
        radial-gradient(circle at 44% 62%,
          rgba(255,255,255,0.95) 0%,
          rgba(255,245,210,0.5) 2.5%,
          rgba(255,210,130,0.12) 5%,
          rgba(255,235,190,0.42) 6.5%,
          rgba(255,200,100,0.08) 8.5%,
          rgba(255,220,160,0.32) 10%,
          rgba(255,180,80,0.05) 12.5%,
          rgba(255,210,140,0.2) 14%,
          transparent 19%),
        /* Luminarias viales */
        radial-gradient(circle at 22% 28%, rgba(255,240,190,0.7) 0%, rgba(255,210,130,0.25) 4%, transparent 11%),
        radial-gradient(circle at 78% 28%, rgba(255,240,190,0.7) 0%, rgba(255,210,130,0.25) 4%, transparent 11%);
    }

    .badge {
      position: absolute;
      top: 14px;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 4;
      backdrop-filter: blur(8px);
      max-width: 44%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge-left { left: 14px; background: rgba(0, 94, 184, 0.92); color: #fff; border: 1px solid var(--rayner-light); }
    .badge-right { right: 14px; background: rgba(15, 23, 42, 0.92); color: #f1f5f9; border: 1px solid #64748b; }

    .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #fff;
      z-index: 5;
      cursor: ew-resize;
      box-shadow: 0 0 12px rgba(0,0,0,0.9);
    }

    .slider-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: var(--rayner-blue);
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    /* Panel de Controles */
    .controls-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: var(--panel);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }

    .lenses-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 850px) {
      .lenses-row { grid-template-columns: 1fr; }
    }

    .control-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .control-group label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94a3b8;
      font-weight: 700;
    }

    .label-rayner { color: var(--rayner-light) !important; }

    .btn-group { display: flex; gap: 0.45rem; flex-wrap: wrap; }

    button {
      flex: 1;
      min-width: fit-content;
      padding: 0.6rem 0.8rem;
      border: 1px solid #334155;
      background: #090d16;
      color: #cbd5e1;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover { border-color: var(--rayner-light); color: #fff; }
    button.active {
      background: var(--rayner-blue);
      border-color: var(--rayner-light);
      color: #fff;
      font-weight: 600;
    }

    button.active-comp {
      background: #334155;
      border-color: #94a3b8;
      color: #fff;
      font-weight: 600;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 850px) {
      .info-grid { grid-template-columns: 1fr; }
    }

    .info-card {
      font-size: 0.88rem;
      line-height: 1.45;
      color: #e2e8f0;
      padding: 0.9rem 1.1rem;
      border-radius: 8px;
    }

    .card-rayner {
      background: rgba(0, 94, 184, 0.15);
      border-left: 4px solid var(--rayner-light);
    }

    .card-comp {
      background: rgba(148, 163, 184, 0.1);
      border-left: 4px solid #64748b;
    }
  </style>
</head>
<body>

<header>
  <h1>Simulador Óptico | <span>Portafolio Rayner</span> vs. Competencia</h1>
</header>

<div class="main-container">
  <div class="simulator-wrapper" id="sim-box">
    <div class="badge badge-left" id="rayner-label">Rayner RayOne Galaxy</div>
    <div class="badge badge-right" id="comp-label">Alcon Clareon PanOptix Pro</div>

    <!-- Capa Derecha: Competencia -->
    <div class="sim-layer" id="layer-comp">
      <div class="scene-content" id="scene-comp"></div>
      <div
