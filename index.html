<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador Óptico | RayOne Galaxy vs. Competencia</title>
  <style>
    :root {
      --primary: #005eb8;
      --dark: #090d16;
      --panel: #131b2e;
      --text: #f8fafc;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1rem 2rem;
      background: var(--panel);
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: 0.4px; }
    header span { color: var(--accent); font-weight: 700; }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      gap: 1.2rem;
    }

    .simulator-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 560px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      user-select: none;
      touch-action: none;
      background: #000;
      border: 1px solid #1e293b;
    }

    .sim-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .sim-layer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.35s ease, transform 0.35s ease;
    }

    #layer-rayner {
      clip-path: inset(0 50% 0 0);
      z-index: 2;
    }

    /* Capa de Disfotopsias (Anillos difractivos + Glare realista en faros) */
    .halo-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      mix-blend-mode: screen;
      background:
        /* Faro izquierdo con anillos difractivos */
        radial-gradient(circle at 28% 60%,
          rgba(255,255,255,0.9) 0%,
          rgba(255,240,200,0.45) 3%,
          rgba(255,210,130,0.12) 6%,
          rgba(255,230,180,0.35) 7.5%,
          rgba(255,200,100,0.08) 9.5%,
          rgba(255,220,160,0.28) 11%,
          rgba(255,180,80,0.05) 13.5%,
          rgba(255,210,140,0.18) 15%,
          transparent 21%),
        /* Faro derecho con anillos difractivos */
        radial-gradient(circle at 42% 60%,
          rgba(255,255,255,0.9) 0%,
          rgba(255,240,200,0.45) 3%,
          rgba(255,210,130,0.12) 6%,
          rgba(255,230,180,0.35) 7.5%,
          rgba(255,200,100,0.08) 9.5%,
          rgba(255,220,160,0.28) 11%,
          rgba(255,180,80,0.05) 13.5%,
          rgba(255,210,140,0.18) 15%,
          transparent 21%),
        /* Luminarias de autopista */
        radial-gradient(circle at 66% 36%,
          rgba(255,245,210,0.75) 0%,
          rgba(255,210,130,0.3) 4%,
          rgba(255,220,150,0.22) 7%,
          transparent 13%),
        radial-gradient(circle at 78% 43%,
          rgba(255,245,210,0.65) 0%,
          rgba(255,210,130,0.25) 3.5%,
          rgba(255,220,150,0.18) 6%,
          transparent 11%);
    }

    /* Halo residual mínimo de referencia para Galaxy (óptica no difractiva) */
    .halo-rayner {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
      mix-blend-mode: screen;
      background:
        radial-gradient(circle at 28% 60%, rgba(255,255,255,0.35) 0%, rgba(255,240,210,0.08) 4%, transparent 9%),
        radial-gradient(circle at 42% 60%, rgba(255,255,255,0.35) 0%, rgba(255,240,210,0.08) 4%, transparent 9%);
    }

    .badge {
      position: absolute;
      top: 16px;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 4;
      backdrop-filter: blur(8px);
    }

    .badge-left { left: 16px; background: rgba(0, 94, 184, 0.92); color: #fff; border: 1px solid var(--accent); }
    .badge-right { right: 16px; background: rgba(15, 23, 42, 0.92); color: #f1f5f9; border: 1px solid #64748b; }

    .slider-handle {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #fff;
      z-index: 5;
      cursor: ew-resize;
      box-shadow: 0 0 12px rgba(0,0,0,0.9);
    }

    .slider-button {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 46px;
      height: 46px;
      background: var(--primary);
      border: 3px solid #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr;
      gap: 1.2rem;
      background: var(--panel);
      padding: 1.25rem;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }

    @media (max-width: 900px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .control-group { display: flex; flex-direction: column; gap: 0.55rem; }
    .control-group label { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: #94a3b8; font-weight: 700; }

    .btn-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    button {
      flex: 1;
      min-width: fit-content;
      padding: 0.65rem 0.85rem;
      border: 1px solid #334155;
      background: #090d16;
      color: #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    button:hover { border-color: var(--accent); color: #fff; }
    button.active {
      background: var(--primary);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 0 12px rgba(0, 94, 184, 0.4);
    }

    .info-bar {
      font-size: 0.92rem;
      line-height: 1.5;
      color: #e2e8f0;
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.2rem;
      border-radius: 0 8px 8px 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Simulador Óptico Comparativo | <span>Rayner RayOne Galaxy</span> vs. Competencia</h1>
</header>

<div class="main-container">

    <!-- Capa Derecha: Competencia -->
    <div class="sim-layer" id="layer-comp">
      <img id="img-comp" src="" alt="Escena Competencia">
      <div class="halo-overlay" id="halo-comp"></div>

    <!-- Capa Izquierda: Rayner -->

        <button data-lens="vivity">Alcon Vivity</button>
        <button data-lens="monofocal">Monofocal</button>
      </div>
    </div>
  </div>

  <div class="info-bar" id="clinical-note"></div>
</div>
