<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Comparador Clínico de Curvas de Desenfoque Binocular | Rayner vs. Competencia</title>
  <style>
    :root {
      --rayner: #005eb8;
      --rayner-bright: #38bdf8;
      --comp: #f59e0b;
      --dark: #090d16;
      --panel: #131b2e;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--dark); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      padding: 1rem 1.5rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    header h1 { font-size: 1.15rem; font-weight: 600; }
    header span { color: var(--rayner-bright); }
    header small { color: var(--muted); font-size: 0.8rem; }

    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .controls-panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.15rem;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 1.25rem;
    }
    @media (max-width: 900px) { .controls-panel { grid-template-columns: 1fr; } }

    .group { display: flex; flex-direction: column; gap: 0.5rem; }
    .group-header { display: flex; align-items: center; gap: 0.5rem; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .dot-r { width: 10px; height: 10px; border-radius: 50%; background: var(--rayner-bright); display: inline-block; }
    .dot-c { width: 10px; height: 10px; border-radius: 50%; background: var(--comp); display: inline-block; }

    .btns { display: flex; gap: 0.45rem; flex-wrap: wrap; }
    button {
      flex: 1;
      min-width: fit-content;
      padding: 0.55rem 0.75rem;
      border: 1px solid #334155;
      background: var(--dark);
      color: #cbd5e1;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.81rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    button:hover { border-color: #64748b; color: #fff; }
    button.act-r { background: var(--rayner); border-color: var(--rayner-bright); color: #fff; font-weight: 600; }
    button.act-c { background: rgba(245, 158, 11, 0.2); border-color: var(--comp); color: #fbbf24; font-weight: 600; }

    .chart-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .chart-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .legend { display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: 0.85rem; font-weight: 600; align-items: center; }
    .legend-item { display: flex; align-items: center; gap: 0.45rem; }
    .line-sample-r { width: 22px; height: 3px; background: var(--rayner-bright); border-radius: 2px; flex-shrink: 0; }
    .line-sample-c { width: 22px; height: 3px; background: var(--comp); border-radius: 2px; flex-shrink: 0; }

    .ext-link {
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 5px;
      background: #090d16;
      border: 1px solid #334155;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .ext-link:hover { color: #fff; border-color: var(--rayner-bright); background: rgba(56, 189, 248, 0.12); }

    /* Barra fija de lectura del cursor (ya no tapa el gráfico) */
    .inspector-bar {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.85rem;
    }
    .inspector-item { display: flex; align-items: center; gap: 0.45rem; }

    .svg-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 7.2;
      min-height: 300px;
      touch-action: none;
      user-select: none;
    }

    svg { width: 100%; height: 100%; display: block; overflow: visible; }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 0.85rem;
    }

    .metric-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1rem;
    }
    .metric-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; margin-bottom: 0.4rem; }
    .metric-vals { display: flex; justify-content: space-between; align-items: baseline; }
    .val-r { color: var(--rayner-bright); font-size: 1.05rem; font-weight: 700; }
    .val-c { color: var(--comp); font-size: 0.95rem; font-weight: 600; }
    .metric-sub { font-size: 0.76rem; color: #64748b; margin-top: 0.25rem; }

    .clinical-summary {
      background: rgba(56, 189, 248, 0.08);
      border-left: 4px solid var(--rayner-bright);
      padding: 1rem 1.2rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      line-height: 1.5;
      color: #e2e8f0;
    }
    .source-links-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
    }
    .ref-text { font-size: 0.74rem; color: #94a3b8; margin-top: 0.65rem; line-height: 1.45; border-top: 1px solid rgba(148, 163, 184, 0.15); padding-top: 0.55rem; }
  </style>
</head>
<body>

<header>
  <h1>Curvas de Desenfoque Binocular | <span>Portafolio Rayner</span> vs. Competencia</h1>
  <small>Metodología homologada: Agudeza Visual Binocular corregida de lejos (logMAR)</small>
</header>

<div class="container">
  <!-- Selectores -->
  <div class="controls-panel">
    <div class="group">
      <div class="group-header" style="color: var(--rayner-bright);"><span class="dot-r"></span> 1. Lente Rayner (Curva Azul)</div>
      <div class="btns" id="btn-rayner">
        <button class="act-r" data-v="galaxy">RayOne Galaxy</button>
        <button data-v="trifocal">RayOne Trifocal</button>
        <button data-v="emv">RayOne EMV (Emetropía)</button>
        <button data-v="emv_mono">RayOne EMV (Monovisión -1.5D)</button>
      </div>
    </div>

    <div class="group">
      <div class="group-header" style="color: var(--comp);"><span class="dot-c"></span> 2. Lente Competencia (Curva Naranja)</div>
      <div class="btns" id="btn-comp">
        <button class="act-c" data-v="puresee">J&J PureSee</button>
        <button data-v="panoptix">Alcon PanOptix</button>
        <button data-v="vivity">Alcon Vivity</button>
        <button data-v="atlara">ZEISS AT LARA</button>
        <button data-v="atlisa">ZEISS AT LISA tri</button>
        <button data-v="eyhance">J&J Eyhance</button>
        <button data-v="symfony">J&J Symfony</button>
      </div>
    </div>
  </div>

  <!-- Gráfico SVG Interactivo -->
  <div class="chart-card">
    <div class="chart-top">
      <div class="legend">
        <div class="legend-item"><span class="line-sample-r"></span> <span id="leg-r"></span></div>
        <div class="legend-item"><span class="line-sample-c"></span> <span id="leg-c"></span></div>
      </div>
      <div style="font-size: 0.78rem; color: #34d399; font-weight: 600;">■ Zona funcional ≤ 0.20 logMAR (20/32 o mejor)</div>
    </div>

    <!-- Barra fija de lectura del punto seleccionado (sin obstruir el gráfico) -->
    <div class="inspector-bar" id="inspector-bar"></div>

    <div class="svg-wrapper" id="chart-area">
      <svg id="defocus-svg" viewBox="0 0 920 400" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <!-- Métricas Clave -->
  <div class="metrics-grid" id="metrics-grid"></div>

  <!-- Análisis Clínico, Enlaces Oficiales y Referencias -->
  <div class="clinical-summary">
    <div id="clinical-text"></div>
    <div class="source-links-row" id="source-links"></div>
    <div class="ref-text" id="ref-text"></div>
  </div>
</div>

<script>
const diopters = [1.0, 0.5, 0.0, -0.5, -1.0, -1.5, -2.0, -2.5, -3.0, -3.5];

// PORTAFOLIO RAYNER (Curva Azul - Binocular)

// PORTAFOLIO COMPETENCIA (Curva Naranja - Homologado a Binocular)
const compCurves = {
  puresee: {
    name: 'J&J TECNIS PureSee',
    url: 'https://www.jnjvisionpro.com/en-us/products/tecnis-puresee/',

    note: '<strong>J&J TECNIS PureSee:</strong> EDOF puramente refractivo con bajo nivel de halos, pero su rango funcional se atenúa a partir de -1.5 D / -2.0 D, ofreciendo menor agudeza cercana que RayOne Galaxy.',
    ref: 'J&J PureSee: Promedio ponderado de Corbett et al. 2024 (Eye), Hassel O. ESCRS 2024, Tandogan et al. ESCRS 2024, Boccuzzi et al. ESCRS 2024.'
  },
  panoptix: {
    name: 'Alcon Clareon / AcrySof PanOptix',
    url: 'https://www.myalcon.com/ar/professional/cataract-surgery/iols/panoptix/',
    va: [0.21, 0.03, -0.06, 0.03, 0.11, 0.04, 0.00, 0.03, 0.16, 0.30],
    note: '<strong>Alcon PanOptix:</strong> Trifocal difractivo (88% eficiencia lumínica) con foco intermedio a 60 cm y cercano a 40 cm. Presenta una caída ("valle") en -1.0 D (
